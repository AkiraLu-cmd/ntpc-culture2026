<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程簽到退 — 新北文化大使</title>
  <style>
    :root {
      --primary:#0f2347; --gold:#c9a84c; --bg:#f8f6f1; --card:#ffffff;
      --success:#2E7D32; --danger:#C62828; --checkout:#5B4A8A;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
    header{ text-align:center; margin-bottom:20px; width:100%; max-width:540px; }
    .logo-bar{ background:var(--primary); color:white; border-radius:14px; padding:18px 24px; }
    .logo-bar h1{ font-size:1.4rem; font-weight:900; letter-spacing:1px; }
    .card{ background:var(--card); border-radius:16px; box-shadow:0 4px 20px rgba(15,35,71,0.08); padding:22px 24px; width:100%; max-width:540px; margin-bottom:16px; }
    .card h2{ font-size:1rem; font-weight:800; margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid var(--bg); }
    .card h2.checkin-title{ color:var(--success); }
    .card h2.checkout-title{ color:var(--checkout); }
    /* 課程選擇 */
    .course-row{ display:flex; gap:10px; align-items:center; }
    .course-row select{ flex:1; padding:12px; border:2px solid #DDD; border-radius:10px; font-size:15px; font-weight:700; color:#333; outline:none; background:white; }
    .course-row select:focus{ border-color:var(--gold); }
    .course-label{ font-size:13px; color:#999; margin-top:6px; }
    .course-active-badge{ display:inline-block; background:#E8F4FD; border:1.5px solid #1565C0; color:#1565C0; font-size:13px; font-weight:bold; padding:3px 10px; border-radius:20px; margin-top:6px; }
    /* 模式切換 */
    .mode-tabs{ display:flex; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(15,35,71,0.1); margin-bottom:16px; width:100%; max-width:540px; }
    .mode-tab{ flex:1; padding:14px; border:none; font-size:16px; font-weight:800; cursor:pointer; background:#DDD; color:#888; transition:0.2s; }
    .mode-tab.active-checkin{ background:var(--success); color:white; }
    .mode-tab.active-checkout{ background:var(--checkout); color:white; }
    .input-group{ margin-bottom:16px; }
    .input-group label{ display:block; font-size:14px; font-weight:700; color:#444; margin-bottom:8px; }
    .input-row{ display:flex; gap:10px; }
    .prefix{ background:var(--primary); color:white; font-weight:bold; font-size:14px; padding:13px; border-radius:10px; white-space:nowrap; display:flex; align-items:center; }
    .prefix.co{ background:var(--checkout); }
    input[type="number"]{ flex:1; padding:13px; border:2px solid #DDD; border-radius:10px; font-size:20px; font-weight:700; outline:none; color:var(--primary); transition:border-color 0.2s; }
    input[type="number"]:focus{ border-color:var(--gold); }
    .lookup-btn{ color:white; border:none; padding:13px; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer; width:100%; margin-top:4px; transition:0.2s; }
    .lookup-btn.ci{ background:var(--primary); }
    .lookup-btn.ci:hover{ background:#1a3560; }
    .lookup-btn.co{ background:var(--checkout); }
    .lookup-btn.co:hover{ background:#4a3a7a; }
    .result-card{ display:none; border-radius:12px; padding:16px; margin-top:14px; border:2px solid; }
    .result-card.found-ci{ background:#EBF5EB; border-color:var(--success); }
    .result-card.found-co{ background:#F0EDF8; border-color:var(--checkout); }
    .result-card.not-found{ background:#FFF3E0; border-color:var(--danger); }
    .result-label{ font-size:13px; color:#666; font-weight:600; margin-bottom:4px; }
    .result-name{ font-size:1.9rem; font-weight:900; color:var(--primary); letter-spacing:2px; }
    .result-id{ font-size:13px; color:#666; margin-top:4px; }
    .already-badge{ display:inline-block; background:#FFF9C4; border:1.5px solid #F9A825; color:#E65100; font-size:13px; font-weight:bold; padding:3px 10px; border-radius:20px; margin-top:6px; }
    .not-ci-badge{ display:inline-block; background:#FFEBEE; border:1.5px solid var(--danger); color:var(--danger); font-size:13px; font-weight:bold; padding:3px 10px; border-radius:20px; margin-top:6px; }
    .confirm-btn{ color:white; border:none; padding:15px; border-radius:10px; font-size:17px; font-weight:bold; cursor:pointer; width:100%; margin-top:12px; transition:0.2s; }
    .confirm-btn:disabled{ background:#AAA; cursor:not-allowed; }
    .confirm-btn.ci{ background:var(--success); }
    .confirm-btn.co{ background:var(--checkout); }
    .note-input{ width:100%; padding:10px; border:1.5px solid #DDD; border-radius:8px; font-size:14px; margin-top:10px; outline:none; }
    .note-input:focus{ border-color:var(--gold); }
    .toast{ display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); color:white; padding:14px 28px; border-radius:50px; font-weight:bold; font-size:16px; z-index:999; box-shadow:0 4px 20px rgba(0,0,0,0.2); white-space:nowrap; }
    .toast.ci{ background:var(--success); }
    .toast.co{ background:var(--checkout); }
    .log-table{ width:100%; border-collapse:collapse; font-size:14px; }
    .log-table th{ background:var(--primary); color:white; padding:10px; text-align:left; }
    .log-table td{ padding:10px; border-bottom:1px solid #EEE; }
    .log-table tr:nth-child(even) td{ background:#F8F8F8; }
    .type-badge{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:bold; }
    .tci{ background:#E8F5E9; color:var(--success); }
    .tco{ background:#EDE7F6; color:var(--checkout); }
    .count-badge{ display:inline-block; background:var(--gold); color:white; font-weight:bold; font-size:13px; padding:3px 10px; border-radius:20px; margin-left:8px; }
    .no-course-mask{ background:rgba(248,246,241,0.85); border-radius:12px; padding:14px; text-align:center; color:#999; font-size:14px; font-weight:600; border:2px dashed #DDD; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="logo-bar">
    <h1>🏮 新北文化大使 課程簽到退</h1>
  </div>
</header>

<!-- 課程選擇（常駐顯示） -->
<div class="card">
  <h2 style="color:var(--primary);">📋 選擇課程</h2>
  <div class="course-row">
    <select id="course-select" onchange="onCourseChange()">
      <option value="">— 請選擇課程 —</option>
      <option value="0">9/19 ｜ 眷村試玩</option>
      <option value="1">9/19 ｜ 解謎試玩</option>
      <option value="2">9/19 ｜ 社造造船活動</option>
      <option value="3">9/20 ｜ 社造造船活動</option>
      <option value="4">9/20 ｜ 林口社造小旅行</option>
    </select>
  </div>
  <div id="course-status" class="course-label">尚未選擇課程，請先選擇後再進行簽到</div>
</div>

<!-- 模式切換 -->
<div class="mode-tabs">
  <button class="mode-tab active-checkin" id="tab-ci" onclick="switchMode('checkin')">✅ 簽到</button>
  <button class="mode-tab" id="tab-co" onclick="switchMode('checkout')">🚪 簽退</button>
</div>

<!-- 簽到退操作 -->
<div class="card">
  <h2 id="card-title" class="checkin-title">🔍 查詢學員編號 — 簽到</h2>
  <div id="main-content">
    <div class="no-course-mask" id="no-course-msg">⬆️ 請先在上方選擇課程</div>
    <div id="lookup-area" style="display:none;">
      <div class="input-group">
        <label>請輸入學員編號後三碼</label>
        <div class="input-row">
          <div class="prefix" id="prefix">NTPCCA－</div>
          <input type="number" id="id-input" placeholder="001" min="1" max="999"
                 oninput="onInput()" onkeydown="if(event.key==='Enter') lookupStudent()">
        </div>
      </div>
      <button class="lookup-btn ci" id="lookup-btn" onclick="lookupStudent()">🔎 查詢姓名</button>
      <div class="result-card" id="result-card">
        <div class="result-label" id="result-label">查詢結果</div>
        <div class="result-name" id="result-name">—</div>
        <div class="result-id"   id="result-id">—</div>
        <div id="status-warn"></div>
        <input class="note-input" id="note-input" type="text" placeholder="備註（選填）">
        <button class="confirm-btn ci" id="confirm-btn" onclick="confirmAction()">✅ 確認簽到</button>
      </div>
    </div>
  </div>
</div>

<!-- 紀錄 -->
<div class="card">
  <h2>📋 本場操作紀錄 <span class="count-badge" id="count-badge">0 筆</span></h2>
  <table class="log-table">
    <thead><tr><th>#</th><th>編號</th><th>姓名</th><th>課程</th><th>類型</th><th>時間</th></tr></thead>
    <tbody id="log-body"></tbody>
  </table>
</div>

let COURSE_NAME = '';
let COURSE_DATE = '';
let COURSE      = '';
const records   = {};
let currentMode = 'checkin';
let currentId   = null;
let currentName = null;

function onCourseChange() {
  const val = document.getElementById('course-select').value;
  const statusEl   = document.getElementById('course-status');
  const lookupArea = document.getElementById('lookup-area');
  const noMsg      = document.getElementById('no-course-msg');

  if (val === '') {
    COURSE_NAME = ''; COURSE_DATE = ''; COURSE = '';
    statusEl.className = 'course-label';
    statusEl.innerText = '尚未選擇課程，請先選擇後再進行簽到';
    lookupArea.style.display = 'none';
    noMsg.style.display = 'block';
    return;
  }

  const c = COURSE_LIST[parseInt(val)];
  COURSE_NAME = c.name; COURSE_DATE = c.date;
  COURSE = COURSE_NAME + '（' + COURSE_DATE + '）';

  statusEl.className = 'course-active-badge';
  statusEl.innerText = '✅ ' + COURSE_NAME + '　' + COURSE_DATE;
  lookupArea.style.display = 'block';
  noMsg.style.display = 'none';

  // 清空上一次查詢結果
  document.getElementById('id-input').value = '';
  document.getElementById('result-card').style.display = 'none';
  currentId = null; currentName = null;
  document.getElementById('id-input').focus();
}

function switchMode(mode) {
  currentMode = mode;
  const ic = mode === 'checkin';
  document.getElementById('tab-ci').className = 'mode-tab' + (ic ? ' active-checkin' : '');
  document.getElementById('tab-co').className = 'mode-tab' + (!ic ? ' active-checkout' : '');
  const title = document.getElementById('card-title');
  title.className = ic ? 'checkin-title' : 'checkout-title';
  title.innerText = ic ? '🔍 查詢學員編號 — 簽到' : '🔍 查詢學員編號 — 簽退';
  document.getElementById('prefix').className = 'prefix' + (!ic ? ' co' : '');
  document.getElementById('lookup-btn').className = 'lookup-btn ' + (ic ? 'ci' : 'co');
  document.getElementById('id-input').value = '';
  document.getElementById('result-card').style.display = 'none';
  currentId = null; currentName = null;
  if (COURSE) document.getElementById('id-input').focus();
}

function pad(n) { return String(n).padStart(3,'0'); }
function onInput() { document.getElementById('result-card').style.display='none'; currentId=null; currentName=null; }

function lookupStudent() {
  if (!COURSE) { alert('請先選擇課程'); return; }
  const raw = document.getElementById('id-input').value.trim();
  if (!raw) { alert('請輸入編號'); return; }
  const ntpcca_id = 'NTPCCA-' + pad(parseInt(raw));
  const name = STUDENTS[ntpcca_id];
  const card=document.getElementById('result-card'), nameEl=document.getElementById('result-name'),
        idEl=document.getElementById('result-id'), warnEl=document.getElementById('status-warn'),
        btn=document.getElementById('confirm-btn'), labelEl=document.getElementById('result-label');
  card.className='result-card'; card.style.display='block'; warnEl.innerHTML='';
  if (!name) {
    card.classList.add('not-found'); nameEl.style.color='var(--danger)';
    nameEl.innerText='找不到此編號'; idEl.innerText=ntpcca_id+' — 請確認號碼是否正確';
    btn.disabled=true; currentId=null; currentName=null; return;
  }
  nameEl.style.color='var(--primary)'; nameEl.innerText=name; idEl.innerText=ntpcca_id;
  currentId=ntpcca_id; currentName=name; btn.disabled=false;
  const rec=records[ntpcca_id]||{};
  if (currentMode==='checkin') {
    card.classList.add('found-ci'); labelEl.innerText='✅ 簽到查詢結果';
    btn.className='confirm-btn ci'; btn.innerText='✅ 確認簽到'; btn.style.background='';
    if (rec.checkin) { warnEl.innerHTML=`<div class="already-badge">⚠️ 此學員今日已簽到（${rec.checkin}）</div>`; btn.innerText='⚠️ 已簽到（再次確認送出）'; btn.style.background='#E65100'; }
  } else {
    card.classList.add('found-co'); labelEl.innerText='🚪 簽退查詢結果';
    btn.className='confirm-btn co'; btn.style.background='';
    if (!rec.checkin) { warnEl.innerHTML=`<div class="not-ci-badge">⚠️ 此學員尚未簽到，仍可送出簽退紀錄</div>`; }
    if (rec.checkout) { warnEl.innerHTML+=`<div class="already-badge" style="margin-top:4px">⚠️ 此學員今日已簽退（${rec.checkout}）</div>`; btn.innerText='⚠️ 已簽退（再次確認送出）'; btn.style.background='#5B4A8A'; }
    else { btn.innerText='🚪 確認簽退'; }
  }
}

async function confirmAction() {
  if (!currentId||!currentName) return;
  const btn=document.getElementById('confirm-btn'), note=document.getElementById('note-input').value.trim();
  btn.disabled=true; btn.innerText='送出中...';
  const now=new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const record={type:currentMode==='checkin'?'簽到':'簽退',timestamp:now,ntpcca_id:currentId,name:currentName,course:COURSE,note:note};
  try {
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(record)});
  } catch(e) { console.warn('送出失敗:',e); }
  if (!records[currentId]) records[currentId]={};
  const ts=now.slice(-8,-3);
  if (currentMode==='checkin') { records[currentId].checkin=ts; } else { records[currentId].checkout=ts; }
  addToLog(currentId, currentName, record.type, COURSE_NAME, ts);
  showToast(currentName+(currentMode==='checkin'?' 簽到成功！':' 簽退成功！'), currentMode);
  document.getElementById('id-input').value=''; document.getElementById('note-input').value='';
  document.getElementById('result-card').style.display='none';
  document.getElementById('id-input').focus();
  currentId=null; currentName=null;
}

function addToLog(id, name, type, course, time) {
  const tbody=document.getElementById('log-body'), count=tbody.rows.length+1, tr=document.createElement('tr');
  const bc=type==='簽到'?'tci':'tco';
  tr.innerHTML=`<td>${count}</td><td>${id}</td><td style="font-weight:bold">${name}</td><td style="font-size:12px;color:#666">${course}</td><td><span class="type-badge ${bc}">${type}</span></td><td>${time}</td>`;
  tbody.insertBefore(tr,tbody.firstChild);
  document.getElementById('count-badge').innerText=count+' 筆';
}

function showToast(msg,mode) {
  const t=document.getElementById('toast');
  t.className='toast '+(mode==='checkin'?'ci':'co');
  t.innerText=(mode==='checkin'?'✅ ':'🚪 ')+msg;
  t.style.display='block'; setTimeout(()=>{t.style.display='none';},2500);
}
</script>
</body>
</html>
