<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訪客登記 — 新北文化大使</title>
  <style>
    :root {
      --primary: #0f2347;
      --gold:    #c9a84c;
      --bg:      #f8f6f1;
      --card:    #ffffff;
      --success: #2E7D32;
      --danger:  #C62828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header { text-align: center; margin-bottom: 28px; width: 100%; max-width: 540px; }
    .logo-bar {
      background: var(--primary);
      color: white;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 12px;
    }
    .logo-bar h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; }
    .course-info { font-size: 14px; opacity: 0.85; margin-top: 6px; line-height: 1.6; }
    .badge-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .badge {
      background: rgba(201,168,76,0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 13px; font-weight: bold;
      padding: 4px 12px; border-radius: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(15,35,71,0.08);
      padding: 28px 24px;
      width: 100%; max-width: 540px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.1rem; color: var(--primary);
      font-weight: 800; margin-bottom: 20px;
      padding-bottom: 10px; border-bottom: 2px solid var(--bg);
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 14px; font-weight: 700;
      color: #444; margin-bottom: 8px;
    }
    .field label .req { color: var(--danger); margin-left: 2px; }
    input[type="text"], input[type="tel"], input[type="email"], input[type="date"] {
      width: 100%; padding: 13px 14px;
      border: 2px solid #DDD; border-radius: 10px;
      font-size: 16px; outline: none; color: #222;
      transition: border-color 0.2s;
      background: white;
    }
    input:focus { border-color: var(--gold); }
    .gender-row { display: flex; gap: 10px; }
    .gender-btn {
      flex: 1; padding: 13px;
      border: 2px solid #DDD; border-radius: 10px;
      background: white; font-size: 16px; font-weight: 600;
      cursor: pointer; color: #555; transition: 0.2s;
    }
    .gender-btn.selected {
      background: #EEF4FF;
      border-color: var(--primary);
      color: var(--primary);
    }
    .submit-btn {
      background: var(--primary); color: white;
      border: none; padding: 16px;
      border-radius: 10px; font-size: 18px;
      font-weight: bold; cursor: pointer;
      width: 100%; margin-top: 6px; transition: 0.2s;
    }
    .submit-btn:hover { background: #1a3560; }
    .submit-btn:disabled { background: #AAA; cursor: not-allowed; }
    .toast {
      display: none; position: fixed;
      top: 20px; left: 50%; transform: translateX(-50%);
      background: var(--success); color: white;
      padding: 14px 28px; border-radius: 50px;
      font-weight: bold; font-size: 16px;
      z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    .log-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .log-table th {
      background: var(--primary); color: white;
      padding: 10px; text-align: left;
    }
    .log-table td { padding: 10px; border-bottom: 1px solid #EEE; }
    .log-table tr:nth-child(even) td { background: #F8F8F8; }
    .count-badge {
      display: inline-block; background: var(--gold);
      color: white; font-weight: bold;
      font-size: 13px; padding: 3px 10px;
      border-radius: 20px; margin-left: 8px;
    }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }
  </style>
</head>
<body>

<div class="toast" id="toast">✅ 登記成功！</div>

<header>
  <div class="logo-bar">
    <h1>🏮 新北文化大使 訪客登記</h1>
    <div class="course-info">POV：解鎖新北文化的「開箱實戰課」</div>
    <div class="badge-row">
      <span class="badge">📅 2026年8月9日（日）</span>
      <span class="badge">🕐 13:30–15:30</span>
    </div>
  </div>
</header>

<div class="card">
  <h2>📋 訪客基本資料</h2>

  <div class="field">
    <label>姓名 <span class="req">*</span></label>
    <input type="text" id="f-name" placeholder="請輸入姓名" oninput="validate()">
    <div class="error-msg" id="err-name">請填寫姓名</div>
  </div>

  <div class="field">
    <label>性別 <span class="req">*</span></label>
    <div class="gender-row">
      <button class="gender-btn" id="g-male"   onclick="selectGender('生理男')">👦 生理男</button>
      <button class="gender-btn" id="g-female" onclick="selectGender('生理女')">👧 生理女</button>
      <button class="gender-btn" id="g-other"  onclick="selectGender('不便透露')">🙂 不便透露</button>
    </div>
    <div class="error-msg" id="err-gender">請選擇性別</div>
  </div>

  <div class="field">
    <label>聯絡電話 <span class="req">*</span></label>
    <input type="tel" id="f-phone" placeholder="請輸入手機號碼" oninput="validate()">
    <div class="error-msg" id="err-phone">請填寫電話</div>
  </div>

  <div class="field">
    <label>Email <span class="req">*</span></label>
    <input type="email" id="f-email" placeholder="請輸入 Email" oninput="validate()">
    <div class="error-msg" id="err-email">請填寫有效的 Email</div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>就讀學校</label>
      <input type="text" id="f-school" placeholder="學校名稱">
    </div>
    <div class="field">
      <label>年級</label>
      <input type="text" id="f-grade" placeholder="例：大二">
    </div>
  </div>

  <div class="field">
    <label>生日</label>
    <input type="date" id="f-birthday">
  </div>

  <div class="field">
    <label>備註</label>
    <input type="text" id="f-note" placeholder="選填">
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitVisitor()" disabled>
    🔒 請完成必填欄位
  </button>
</div>

<!-- 本場登記名單 -->
<div class="card">
  <h2>📋 本場訪客紀錄
    <span class="count-badge" id="count-badge">0 人</span>
  </h2>
  <table class="log-table">
    <thead>
      <tr><th>#</th><th>姓名</th><th>性別</th><th>學校</th><th>時間</th></tr>
    </thead>
    <tbody id="log-body"></tbody>
  </table>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxQj3cXhRWwrzHxJUAePJBQUqdqKI_iiMx8_juaAPeBX8EYFfTNNKGOT8JcK23txhpo/exec';
const COURSE  = 'POV：解鎖新北文化的「開箱實戰課」（2026/08/09）';

let selectedGender = '';

function selectGender(val) {
  selectedGender = val;
  ['g-male','g-female','g-other'].forEach(id => {
    document.getElementById(id).classList.remove('selected');
  });
  const map = { '生理男':'g-male', '生理女':'g-female', '不便透露':'g-other' };
  document.getElementById(map[val]).classList.add('selected');
  document.getElementById('err-gender').style.display = 'none';
  validate();
}

function validate() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const ok = name && selectedGender && phone && emailOk;
  const btn = document.getElementById('submit-btn');
  btn.disabled = !ok;
  btn.innerText = ok ? '✅ 送出訪客登記' : '🔒 請完成必填欄位';
  btn.style.background = ok ? 'var(--primary)' : '#AAA';
}

async function submitVisitor() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerText = '送出中...';

  const now = new Date().toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  });

  const record = {
    type      : 'visitor',
    timestamp : now,
    name      : document.getElementById('f-name').value.trim(),
    gender    : selectedGender,
    phone     : document.getElementById('f-phone').value.trim(),
    email     : document.getElementById('f-email').value.trim(),
    school    : document.getElementById('f-school').value.trim(),
    grade     : document.getElementById('f-grade').value.trim(),
    birthday  : document.getElementById('f-birthday').value,
    course    : COURSE,
    note      : document.getElementById('f-note').value.trim()
  };

  try {
    await fetch(GAS_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify(record)
    });
  } catch(e) {
    console.warn('送出失敗:', e);
  }

  addToLog(record.name, record.gender, record.school, now.slice(-8,-3));
  showToast(record.name + ' 登記成功！');
  resetForm();
}

function addToLog(name, gender, school, time) {
  const tbody = document.getElementById('log-body');
  const count = tbody.rows.length + 1;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${count}</td><td style="font-weight:bold">${name}</td><td>${gender}</td><td>${school||'—'}</td><td>${time}</td>`;
  tbody.insertBefore(tr, tbody.firstChild);
  document.getElementById('count-badge').innerText = count + ' 人';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = '✅ ' + msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function resetForm() {
  ['f-name','f-phone','f-email','f-school','f-grade','f-birthday','f-note'].forEach(id => {
    document.getElementById(id).value = '';
  });
  selectedGender = '';
  ['g-male','g-female','g-other'].forEach(id => {
    document.getElementById(id).classList.remove('selected');
  });
  validate();
  document.getElementById('f-name').focus();
}
</script>
</body>
</html>
